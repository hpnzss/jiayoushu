<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 家有数</title><link rel="stylesheet" href="/style.css"><script defer src="/auth.js"></script></head>
<body class="auth-body"><main class="auth-main"><div class="brand"><span class="logo">家</span><div>家有数<small>让家庭财富有迹可循</small></div></div>
<section class="panel auth-card"><div class="eyebrow">我们的家庭账本</div><h1 id="authTitle">正在检查登录状态…</h1><p id="authIntro" class="muted"></p>
<form id="loginForm" hidden><label class="field">登录名<input id="loginUsername" autocomplete="username" required maxlength="40"></label><label class="field">密码<input id="loginPassword" type="password" autocomplete="current-password"></label><button class="solid auth-submit" type="submit">登录家庭账本</button><button class="outline auth-submit" type="button" id="forgotButton">忘记密码</button></form>
<form id="setupForm" hidden><label class="field">管理员称呼<input id="setupName" maxlength="40" placeholder="如：我、爸爸或你的名字"></label><label class="field">管理员登录名<input id="setupUsername1" autocomplete="username" pattern="[A-Za-z0-9._-]{3,40}" required placeholder="如：hpnzss"></label><label class="field">管理员密码<input id="setupPassword1" type="password" autocomplete="new-password"></label><label class="field">再次输入密码<input id="setupConfirm1" type="password" autocomplete="new-password"></label><p class="muted">只创建一个管理员，其他成员进入后在设置中添加。密码不限制长度和字符组合，请自行妥善保存。</p><button class="solid auth-submit" type="submit">创建管理员</button></form>
<form id="recoverForm" hidden><p class="muted">管理员使用首次设置时保存的恢复码重设密码；普通成员可请管理员在设置中重设。</p><label class="field">管理员登录名<input id="recoverUsername" autocomplete="username" required></label><label class="field">恢复码<input id="recoverCode" autocomplete="off" required placeholder="从保存的恢复卡中复制"></label><label class="field">新密码<input id="recoverPassword" type="password" autocomplete="new-password"></label><label class="field">再次输入新密码<input id="recoverConfirm" type="password" autocomplete="new-password"></label><button class="solid auth-submit" type="submit">重设密码</button><button id="backLogin" class="outline auth-submit" type="button">返回登录</button></form>
<div id="recoveryCard" hidden><h2>保存你的管理员恢复卡</h2><p>忘记密码时，在登录页点“忘记密码”，填写下面的恢复码即可重设。恢复码不要发给别人。</p><code id="recoveryValue" class="recovery-code"></code><div class="actions"><button id="saveRecovery" class="solid" type="button">下载恢复卡</button><button id="continueLogin" class="outline" type="button">进入家庭账本</button></div></div>
<p id="authMessage" role="status" class="auth-message"></p></section><p class="muted auth-foot">先建资金账户 → 每月填报 → 核对关账 → 查看本月变化</p></main></body></html>
