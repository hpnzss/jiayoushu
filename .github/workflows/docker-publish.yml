name: Test and release Docker preview

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-preview-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test household ledger
        run: |
          node verify-unified.cjs
          node verify-http.cjs
          node verify-periods.cjs
          node verify-backup.cjs
          node verify-deployment.cjs
          node verify-auth.cjs
          node verify-currency-ledger.cjs
          node verify-fx.cjs
          node verify-month-balances.cjs
          node verify-dashboard.cjs
          node verify-history.cjs
          node verify-history-general.cjs
          node verify-maintenance.cjs
          node verify-income-charts.cjs
          node verify-v09.cjs
          node verify-v010.cjs
          node verify-v011.cjs
          node verify-table-sort.cjs
          node verify-v012.cjs
          node verify-v013.cjs
          node verify-v014.cjs
          node verify-v015.cjs

  publish:
    needs: test
    if: github.repository == 'hpnzss/jiayoushu' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build image for Synology DS423+
        run: docker build --platform linux/amd64 --tag "jiayoushu-ci:$GITHUB_SHA" .
      - name: Start isolated container for health check
        run: |
          docker run -d --name jiayoushu-smoke --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m --cap-drop ALL --security-opt no-new-privileges --volume jiayoushu-smoke-data:/data --env FAMILY_FX_DISABLE=1 "jiayoushu-ci:$GITHUB_SHA"
          for attempt in $(seq 1 30); do
            if docker exec jiayoushu-smoke node healthcheck.cjs; then
              exit 0
            fi
            sleep 2
          done
          docker logs jiayoushu-smoke
          exit 1
      - name: Show container logs on failure
        if: failure()
        run: docker logs jiayoushu-smoke || true
      - name: Remove temporary test container and data
        if: always()
        run: |
          docker rm -f jiayoushu-smoke || true
          docker volume rm jiayoushu-smoke-data || true
      - name: Sign in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Check release tag matches image version
        run: |
          version=$(docker image inspect "jiayoushu-ci:$GITHUB_SHA" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Release tag must match v$version"
            exit 1
          fi
      - name: Publish tested preview image
        run: |
          docker tag "jiayoushu-ci:$GITHUB_SHA" "hpnzss/jiayoushu:sha-$GITHUB_SHA"
          docker tag "jiayoushu-ci:$GITHUB_SHA" hpnzss/jiayoushu:preview
          docker push "hpnzss/jiayoushu:sha-$GITHUB_SHA"
          version=$(docker image inspect "jiayoushu-ci:$GITHUB_SHA" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')
          case "$version" in ""|*[!a-zA-Z0-9_.-]*) echo "Invalid version label"; exit 1;; esac
          docker tag "jiayoushu-ci:$GITHUB_SHA" "hpnzss/jiayoushu:$version"
          docker push "hpnzss/jiayoushu:$version"
          docker push hpnzss/jiayoushu:preview
